<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instalar Cartucho Music</title>
  </head>
  <body>
    <div class="window" id="window">
      <svg class="waves" viewBox="0 0 780 520" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="w-top" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff7a2f" />
            <stop offset="0.55" stop-color="#ff5a12" stop-opacity="0.85" />
            <stop offset="1" stop-color="#ff5a12" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="w-bottom" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0" stop-color="#ff7a2f" />
            <stop offset="0.6" stop-color="#ff5a12" stop-opacity="0.75" />
            <stop offset="1" stop-color="#ff5a12" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="w-glow-top" cx="0" cy="0" r="1" gradientTransform="translate(40 10) scale(420 230)" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff6a1c" stop-opacity="0.6" />
            <stop offset="0.45" stop-color="#c2400a" stop-opacity="0.35" />
            <stop offset="1" stop-color="#5a1a02" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="w-glow-bottom" cx="0" cy="0" r="1" gradientTransform="translate(780 440) scale(380 220)" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff6a1c" stop-opacity="0.6" />
            <stop offset="0.5" stop-color="#b13a08" stop-opacity="0.22" />
            <stop offset="1" stop-color="#5a1a02" stop-opacity="0" />
          </radialGradient>
          <filter id="w-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" /></filter>
          <filter id="w-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4" /></filter>
        </defs>

        <g class="wave wave-top">
          <path d="M0 0 H520 C430 30 360 40 290 70 C210 104 120 112 0 178 Z" fill="url(#w-glow-top)" />
          <path d="M0 150 C110 96 190 92 270 58 C340 28 410 12 520 0" fill="none" stroke="url(#w-top)" stroke-width="10" filter="url(#w-blur)" opacity="0.8" />
          <path d="M0 150 C110 96 190 92 270 58 C340 28 410 12 520 0" fill="none" stroke="url(#w-top)" stroke-width="2.2" />
          <path d="M0 104 C90 70 160 62 230 36 C280 18 320 6 380 -4" fill="none" stroke="url(#w-top)" stroke-width="1.3" filter="url(#w-soft)" opacity="0.7" />
          <path d="M0 186 C130 120 230 104 320 62 C390 30 460 8 600 -6" fill="none" stroke="url(#w-top)" stroke-width="1" opacity="0.35" />
        </g>

        <g class="wave wave-bottom">
          <path d="M780 280 C700 340 640 372 560 400 C470 432 410 448 340 520 H780 Z" fill="url(#w-glow-bottom)" />
          <path d="M780 300 C700 356 630 384 560 410 C480 440 420 470 380 520" fill="none" stroke="url(#w-bottom)" stroke-width="10" filter="url(#w-blur)" opacity="0.75" />
          <path d="M780 300 C700 356 630 384 560 410 C480 440 420 470 380 520" fill="none" stroke="url(#w-bottom)" stroke-width="2.2" />
          <path d="M780 350 C720 392 660 412 600 434 C540 456 500 480 470 520" fill="none" stroke="url(#w-bottom)" stroke-width="1.2" filter="url(#w-soft)" opacity="0.6" />
          <path d="M600 420 C540 400 480 400 430 420" fill="none" stroke="url(#w-bottom)" stroke-width="1" opacity="0.3" />
        </g>
      </svg>

      <header class="titlebar" data-tauri-drag-region>
        <button class="win-btn" id="btn-minimize" type="button" aria-label="Minimizar" title="Minimizar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" /></svg>
        </button>
        <button class="win-btn" id="btn-close" type="button" aria-label="Cerrar" title="Cerrar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" /></svg>
        </button>
      </header>

      <main class="stage" data-tauri-drag-region>
        <div class="mark" data-tauri-drag-region>
          <div class="mark-frame" id="mark">
            <svg class="cassette" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="22" y="30" width="76" height="40" rx="9" class="c-window" />
              <g class="reel" id="reel-a" style="transform-origin: 44px 50px">
                <circle cx="44" cy="50" r="10" class="c-reel" />
                <path d="M44 42v5M44 53v5M36 50h5M47 50h5" class="c-spoke" />
              </g>
              <g class="reel" id="reel-b" style="transform-origin: 76px 50px">
                <circle cx="76" cy="50" r="10" class="c-reel" />
                <path d="M76 42v5M76 53v5M68 50h5M79 50h5" class="c-spoke" />
              </g>
              <path d="M30 84h60M30 94h60" class="c-line" />
            </svg>
          </div>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <section class="panel" id="panel" aria-live="polite"></section>
      </main>

      <footer class="footer">
        <span class="version" id="version"></span>
        <div class="actions">
          <button class="btn btn-ghost" id="btn-secondary" type="button"></button>
          <button class="btn btn-primary" id="btn-primary" type="button"></button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
