[package]
name = "cartucho-music-installer"
version = "0.0.0"
description = "Instalador propio de Cartucho Music"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
# El instalador se descarga: que pese poco.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
serde_json = "1"
