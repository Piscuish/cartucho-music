[package]
name = "cartucho-music"
version = "1.0.3"
description = "Cartucho Music — cliente musical de escritorio"
edition = "2021"

[lib]
name = "cartucho_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = "4.2.0"
thiserror = "2.0.21"
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros"] }
tauri-plugin-opener = "2.7.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
