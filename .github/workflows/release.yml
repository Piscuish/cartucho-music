# Publicación: al subir una etiqueta `vX.Y.Z`, compila el instalador de Windows y
# crea un BORRADOR de Release con él. Revísalo en GitHub y pulsa «Publish» cuando quieras.
#
#   git tag v1.0.1
#   git push origin v1.0.1
#
# También se puede lanzar sin Git: Actions → Release → «Run workflow» sobre main. Entonces
# crea él mismo la etiqueta v<versión de tauri.conf.json> en ese commit, tras pasar las pruebas.
#
# La versión de la etiqueta debe coincidir con la de `src-tauri/tauri.conf.json`.
#
# Requiere dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contenido de la clave privada del actualizador
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contraseña
# Con ellos se firma el instalador y se publica `latest.json` para las actualizaciones automáticas.
name: Release

# Con una etiqueta, o a mano desde main (la etiqueta se deduce de la versión de la app;
# nunca se usa el nombre de la rama).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Determinar la etiqueta de la versión
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Lánzalo sobre la rama main." }
            $tag = "v" + (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          } else {
            $tag = "${{ github.ref_name }}"
          }
          Write-Output "Etiqueta: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      # Diagnóstico de la firma ANTES de compilar (1 min en vez de 12). Nunca imprime los secretos:
      # solo el veredicto, como anotación «::error::» visible en el resumen de la ejecución.
      - name: Comprobar los secretos de firma del actualizador
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          function Fail($msg) { Write-Output "::error title=Firma del actualizador::$msg"; exit 1 }
          $key = "$env:TAURI_SIGNING_PRIVATE_KEY".Trim()
          if (-not $key) { Fail "Falta el secreto TAURI_SIGNING_PRIVATE_KEY (o no está en Settings → Secrets and variables → Actions → Secrets)." }
          if (-not "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD") { Fail "Falta el secreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD." }
          try { $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key)) }
          catch { Fail "TAURI_SIGNING_PRIVATE_KEY no es base64 válido: pega el contenido completo de cartucho-music-updater.key, sin añadir nada." }
          if ($text -match "public key") { Fail "TAURI_SIGNING_PRIVATE_KEY contiene la clave PÚBLICA (.key.pub). Debe ser la privada: cartucho-music-updater.key." }
          if ($text -notmatch "secret key") { Fail "TAURI_SIGNING_PRIVATE_KEY no parece una clave privada de Tauri." }
          Set-Content probe.txt "firma de prueba"
          $out = npx tauri signer sign probe.txt 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            if ($out -match "Wrong password") { Fail "TAURI_SIGNING_PRIVATE_KEY_PASSWORD no corresponde a la clave privada (contraseña incorrecta)." }
            Fail "La clave privada no ha podido firmar un archivo de prueba."
          }
          Remove-Item probe.txt, probe.txt.sig -ErrorAction SilentlyContinue
          Write-Output "La clave y la contraseña firman correctamente."

      - name: Comprobar que la etiqueta coincide con la versión de la app
        shell: pwsh
        run: |
          $app = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ steps.tag.outputs.tag }}".TrimStart("v")
          if ($app -ne $tag) { throw "La etiqueta v$tag no coincide con la versión $app de tauri.conf.json" }

      - name: Pruebas antes de publicar
        run: |
          npm run build
          npm run installer:build
          npm run check

      # Solo al lanzarlo a mano: crea la etiqueta en este commit, ya probado. Si existe en este
      # mismo commit (reintento) se reutiliza; si apunta a otro, se para para no pisarla.
      # Una etiqueta subida con GITHUB_TOKEN no vuelve a disparar este workflow.
      - name: Crear la etiqueta
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $remote = git ls-remote origin "refs/tags/$tag"
          if ($remote) {
            $sha = git ls-remote origin "refs/tags/$tag^{}"
            if (-not $sha) { $sha = $remote }
            if (-not ("$sha".StartsWith("${{ github.sha }}"))) {
              throw "La etiqueta $tag ya existe en otro commit. Sube la versión antes de lanzar otra Release."
            }
            Write-Output "La etiqueta $tag ya existe en este commit: se reutiliza."
          } else {
            git tag $tag
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la etiqueta $tag." }
          }

      - name: Compilar y crear el borrador de Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Cartucho Music ${{ steps.tag.outputs.tag }}"
          releaseBody: |
            Para Windows 10/11 (x64). Se instala para el usuario actual, sin permisos de administrador.

            **Descarga `Cartucho-Music-${{ steps.tag.outputs.tag }}-Instalador.exe`.** El otro instalador (`*_x64-setup.exe`) es el que usa el actualizador automático de la app; también sirve para instalar a mano.

            Los instaladores no están firmados: Windows SmartScreen puede mostrar un aviso. Pulsa «Más información → Ejecutar de todas formas».
          releaseDraft: true
          prerelease: false
          # Publica latest.json (lo que consulta el actualizador de la app) apuntando al instalador NSIS.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Instalador propio (installer/): una ventana con el diseño de Cartucho que lleva dentro
      # el instalador NSIS de arriba y lo ejecuta en silencio. El NSIS sigue en la Release
      # porque latest.json (el actualizador) apunta a él.
      - name: Compilar el instalador propio
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No se encontró el instalador NSIS generado por Tauri." }
          $app = Get-ChildItem "src-tauri/target/release/*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $app) { throw "No se encontró el ejecutable de la app." }
          $env:CARTUCHO_SETUP_EXE = $setup.FullName
          $env:CARTUCHO_APP_EXE = $app.FullName
          Write-Output "Incrustando $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB); app: $($app.Name)"
          npm run installer:tauri -- build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador propio." }

      - name: Subir el instalador propio al borrador de Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "installer/src-tauri/target/release/*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No se encontró el instalador propio compilado." }
          $name = "Cartucho-Music-${{ steps.tag.outputs.tag }}-Instalador.exe"
          Copy-Item $exe.FullName $name
          gh release upload "${{ steps.tag.outputs.tag }}" $name --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo subir $name a la Release." }
